name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          apps/web/package-lock.json
          apps/mobile/package-lock.json
    
    - name: Install dependencies (web)
      run: |
        cd apps/web
        npm ci
    
    - name: Run typecheck (web)
      run: |
        cd apps/web
        npm run typecheck
    
    - name: Run lint (web)
      run: |
        cd apps/web
        npm run lint 2>/dev/null || echo "No lint script configured"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
    
    - name: Install dependencies
      run: |
        cd apps/web
        npm ci
        npx vitest --version
    
    - name: Run tests
      run: |
        cd apps/web
        npm run test -- --coverage
      env:
        NODE_ENV: test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
    
    - name: Run npm audit
      run: |
        cd apps/web
        npm audit --audit-level=moderate
    
    - name: Check for secrets
      run: |
        # Use git-secrets or truffleHog if available
        npm install -g detect-secrets
        detect-secrets scan --baseline .secrets.baseline 2>/dev/null || echo "detect-secrets not fully configured"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, security-audit]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
    
    - name: Install dependencies
      run: |
        cd apps/web
        npm ci
    
    - name: Build web app
      run: |
        cd apps/web
        npm run build
      env:
        NODE_ENV: production
        DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/test
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-test' }}
        AUTH_SECRET: test_secret_32_bytes_long_for_testing
        VITE_FIREBASE_API_KEY: test
        VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: test-project
        VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
        VITE_FIREBASE_MESSAGING_SENDER_ID: 123456789
        VITE_FIREBASE_APP_ID: 1:123456789:web:abc123
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: apps/web/build/
        retention-days: 7
